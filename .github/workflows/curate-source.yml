name: Curate GCCE source snapshot

on:
  push:
    branches: [portfolio-curation]
    paths:
      - '.github/workflows/curate-source.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: portfolio-curation

      - name: Clone capstone source repository
        run: |
          git clone --depth 1 https://github.com/tzu-hsiang-weng/VoI-Driven-Transport-Selection-for-Heterogeneous-LoRa-Wi-Fi-IoT-with-Unified-MQTT-Abstraction.git /tmp/capstone

      - name: Copy and rename research source files
        run: |
          mkdir -p src
          cp /tmp/capstone/ai/prepare_clean_source.py src/01_prepare_water_level_data.py
          cp /tmp/capstone/ai/build_fsm.py src/02_build_semantic_fsm_labels.py
          cp /tmp/capstone/ai/build_features.py src/03_build_causal_features.py
          cp /tmp/capstone/ai/data_augmentation.py src/04_select_balanced_synthetic_events.py
          cp /tmp/capstone/ai/catboost_teacher.py src/05_freeze_catboost_teacher.py
          cp /tmp/capstone/ai/final_teacher_decision_catboost.py src/06_finalize_teacher_selection.py
          cp /tmp/capstone/ai/student_kd_feature_policy.py src/07_define_student_protocol.py
          cp /tmp/capstone/ai/receding_memory_dt_students.py src/08_train_student_candidates.py
          cp /tmp/capstone/ai/student_candidates.py src/09_audit_student_candidates.py
          cp /tmp/capstone/ai/final_student.py src/10_freeze_final_student.py

          # Remove the original machine-specific absolute path from the curated snapshot.
          python - <<'PY'
          from pathlib import Path
          p = Path('src/10_freeze_final_student.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'direct = Path(r"C:\\\\翁\\\\nanshenqiao_stage1\\\\outputs\\\\student_receding_dt_v3c\\\\models") / f"{STUDENT_NAME}.joblib"',
              'direct = root / "outputs" / "student_receding_dt_v3c" / "models" / f"{STUDENT_NAME}.joblib"'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit curated source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add curated GCCE research source code"
            git push origin portfolio-curation
          fi
